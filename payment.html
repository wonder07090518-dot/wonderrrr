<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Wonder Ad Lab · Secure checkout</title>
  <link rel="stylesheet" href="payment.css" />
</head>
<body>
  <main class="payment-shell">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><rect x="2" y="2" width="96" height="96" rx="27" fill="#171719"/><path d="M15 31 31 76 50 48 69 76 85 31 70 42 50 69 30 42Z" fill="#fff"/><path d="m50 13 4 13 13 4-13 4-4 13-4-13-13-4 13-4Z" fill="#0071e3"/></svg>
      Wonder Ad Lab
    </a>
    <section class="payment-card">
      <p class="kicker">SECURE CHECKOUT</p>
      <h1 id="paymentTitle">完成付款</h1>
      <p class="description" id="paymentDescription">正在载入订单…</p>
      <div class="amount" id="paymentAmount">¥0</div>
      <section class="secure-checkout" id="secureCheckout">
        <div class="secure-heading"><span>STRIPE</span><b id="secureTitle">安全付款</b></div>
        <p id="secureDescription">银行卡与可用的钱包方式会在 Stripe 官方付款页中完成，本站不会保存卡号。</p>
        <button class="confirm secure-button" id="startStripeCheckout">前往安全付款</button>
        <small id="secureMode">测试连接阶段不会产生真实扣款</small>
      </section>
      <section class="payment-result" id="paymentResult" hidden aria-live="polite">
        <span class="result-spinner" aria-hidden="true"></span>
        <strong id="paymentResultTitle">正在确认付款结果</strong>
        <p id="paymentResultMessage">只以 Stripe 官方回调为准，请稍候。</p>
        <a href="index.html" id="paymentResultHome">返回网站</a>
      </section>
      <button class="manual-toggle" id="manualToggle" type="button" aria-expanded="false">无法使用？改用微信或支付宝人工付款</button>
      <div class="manual-payment" id="manualPayment" hidden>
        <div class="methods">
          <button data-method="微信支付" id="wechatMethod">微信支付</button>
          <button data-method="支付宝" id="alipayMethod">支付宝</button>
        </div>
        <div class="qr-wrap">
          <div class="qr-image">
            <img id="paymentQr" alt="支付收款码" />
          </div>
          <p id="paymentHint">请使用对应 App 扫码付款</p>
        </div>
        <button class="confirm" id="confirmPayment">我已完成付款</button>
        <p class="notice" id="paymentNotice">人工付款需要工作室核对实际到账后，订单才会标记为已支付。</p>
      </div>
    </section>
  </main>
  <script src="payment.js?v=20260904a"></script>
</body>
</html>
